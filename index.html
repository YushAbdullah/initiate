  for(const w of text.split(' ')){ const t=line?line+' '+w:w; if(x.measureText(t).width>maxW&&line){ lines.push(line); line=w; } else line=t; }
  if(line) lines.push(line);
  if(lines.length>maxLines){ lines.length=maxLines; let l=lines[maxLines-1]; while(l.length&&x.measureText(l+'…').width>maxW) l=l.slice(0,-1); lines[maxLines-1]=l+'…'; }
  lines.forEach((l,i)=>x.fillText(l,X,Y+i*lh));
}
function loadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
async function makeCard(){
  const W=1080,H=1350, c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  try{ await Promise.race([Promise.all(['600 60px Outfit','700 40px Outfit','700 44px Caveat','500 28px Outfit','800 24px Outfit'].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,2500))]); }catch(e){}
  const G=gradeInfo(), L=S.launch||computeLaunch(), idea=I();
  const F=(w,s,f)=>`${w} ${s}px ${f==='h'?'Caveat, cursive':'Outfit, Segoe UI, sans-serif'}`;
  // cutting mat
  x.fillStyle='#F6FEF6'; x.fillRect(0,0,W,H);
  [[W*.9,0],[0,H*.55]].forEach(([gx,gy])=>{ const gr=x.createRadialGradient(gx,gy,0,gx,gy,620); gr.addColorStop(0,'#D3F3D9'); gr.addColorStop(1,'rgba(246,254,246,0)'); x.fillStyle=gr; x.fillRect(0,0,W,H); });
  x.strokeStyle='rgba(16,40,20,.05)'; x.lineWidth=2;
  for(let i=0;i<=W;i+=45){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke();}
  for(let j=0;j<=H;j+=45){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke();}
  // confetti scraps
  const conf=['#e5533d','#f2b632','#3557c6','#45a865','#ef8db0','#9478d1','#1f9e93'];
  for(let i=0;i<22;i++){ x.save(); x.translate(Math.random()*W,Math.random()*H); x.rotate(Math.random()*6); x.fillStyle=conf[i%conf.length]; x.globalAlpha=.85; rr(x,-14,-8,28,16,4); x.fill(); x.restore(); }
  // paper sheet
  x.save(); x.translate(W/2,H/2+10); x.rotate(-.012); x.shadowColor='rgba(16,40,20,.18)'; x.shadowBlur=60; x.shadowOffsetY=24; x.fillStyle='#ffffff'; rr(x,-470,-600,940,1200,28); x.fill(); x.restore();
  // tape
  x.save(); x.translate(W/2,92); x.rotate(-.05); x.fillStyle='rgba(242,182,50,.7)'; x.fillRect(-90,-20,180,40); x.restore();
  const L0=110;
  x.fillStyle='#23262e'; x.textBaseline='alphabetic';
  // logo letters
  const letters='INITIATE'; let lx=L0;
  letters.split('').forEach((ch,i)=>{ x.save(); x.translate(lx+22,180); x.rotate((i%2?1:-1)*.06); x.fillStyle=conf[i%conf.length]; rr(x,-22,-36,44,52,8); x.fill(); x.fillStyle=i===1?'#23262e':'#fff'; x.font=F(700,36,'d'); x.textAlign='center'; x.fillText(ch,0,4); x.restore(); lx+=52; });
  x.textAlign='left';
  x.fillStyle='#5d6271'; x.font=F(800,22,'b'); x.fillText('PRODUCT LIFECYCLE REPORT CARD',L0,250);
  // avatar
  try{ const im=await loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(avatarSVG(S.player))); x.save(); x.shadowColor='rgba(0,0,0,.25)'; x.shadowBlur=12; x.shadowOffsetY=6; x.fillStyle='#f1efe9'; rr(x,L0,280,220,250,16); x.fill(); x.restore(); x.drawImage(im,L0+20,292,180,210); }catch(e){}
  // name + idea
  x.fillStyle='#23262e'; x.font=F(700,58,'d'); x.fillText(S.player.name,L0+250,340);
  x.fillStyle='#3557c6'; x.font=F(700,38,'d'); x.fillText(idea.name,L0+250,392);
  x.fillStyle='#23262e'; x.font=F(700,34,'h'); wrapText(x,`"${S.oneLiner||idea.pitch}"`,L0+250,440,390,38,3);
  // grade circle
  x.save(); x.translate(W-210,420); x.rotate(.08); x.fillStyle='#6BE683'; x.beginPath(); x.arc(0,0,92,0,Math.PI*2); x.fill(); x.fillStyle='#23262e'; x.font=F(700,110,'d'); x.textAlign='center'; x.fillText(G.grade,0,38); x.restore();
  x.textAlign='center'; x.font=F(800,24,'b'); x.fillStyle='#23262e'; x.fillText(G.rank.toUpperCase(),W-210,545); x.textAlign='left';
  // stats boxes
  const stats=[['Rating',`${L.rating}★`,'#3557c6'],['Customers',String(L.active),'#262828'],['Revenue / month',fmtRM(L.revenue),'#1A7F55'],['Shipped in',`${S.weeks} weeks`,'#e5533d']];
  stats.forEach(([k,v,col],i)=>{ const bx=L0+i*218, by=590; x.save(); x.translate(bx+100,by+65); x.rotate((i%2?1:-1)*.015); x.fillStyle=col; rr(x,-100,-65,200,130,12); x.fill(); x.fillStyle='rgba(255,255,255,.85)'; x.font=F(800,18,'b'); x.fillText(k.toUpperCase(),-84,-28); x.fillStyle='#fff'; x.font=F(700,v.length>9?30:38,'d'); x.fillText(v,-84,26); x.restore(); });
  // lifecycle bars
  x.fillStyle='#5d6271'; x.font=F(800,22,'b'); x.fillText('SCORE BY STAGE',L0,790);
  STG.forEach((st,i)=>{ const v=S.scores[st.id]??0, col=i<6?0:1, row=i<6?i:i-6, bx=L0+col*430, by=820+row*44;
    x.fillStyle='#23262e'; x.font=F(700,22,'b'); x.fillText(st.short,bx,by+20);
    x.fillStyle='#E3F8E6'; rr(x,bx+150,by+4,210,20,10); x.fill();
    x.fillStyle=v>=75?'#1CBB6C':v>=50?'#f2b632':'#e5533d'; rr(x,bx+150,by+4,Math.max(20,210*v/100),20,10); x.fill();
    x.fillStyle='#23262e'; x.font=F(800,20,'b'); x.fillText(String(v),bx+372,by+21); });
  // badges + level
  x.fillStyle='#5d6271'; x.font=F(800,22,'b'); x.fillText(`LEVEL ${S.level} · ${S.badges.length} BADGE${S.badges.length===1?'':'S'}`,L0,1110);
  let bx=L0, by=1130;
  S.badges.slice(0,6).forEach((id,i)=>{ const b=BADGES.find(z=>z.id===id); x.font=F(800,22,'b'); const w=x.measureText(b.name).width+36; if(bx+w>W-L0){ bx=L0; by+=50; } x.fillStyle=conf[i%conf.length]; rr(x,bx,by,w,40,20); x.fill(); x.fillStyle='#fff'; x.fillText(b.name,bx+18,by+28); bx+=w+12; });
  if(S.badges.length>6){ x.font=F(800,22,'b'); x.fillStyle='#5d6271'; x.fillText(`+${S.badges.length-6} more`,bx,by+28); }
  if(!S.badges.length){ x.fillStyle='#5d6271'; x.font=F(600,22,'b'); x.fillText('No badges yet. Replay to earn some.',L0,1158); }
  // footer
  x.fillStyle='#23262e'; x.font=F(700,30,'h'); x.fillText('Napkin → BMC → Pitch → Scrum + DevOps → QA → UAT → Real users',L0,1258);
  return c;
}
function postText(){
  const G=gradeInfo(), L=S.launch||computeLaunch();
  return `I just took "${I().name}" from a scattered idea to launch in INITIATE, a product lifecycle game.\n\nGrade ${G.grade} (${G.rank}) · ${L.rating}★ from real users · ${L.active} customers · ${fmtRM(L.revenue)} a month · shipped in ${S.weeks} weeks.\n\nIdea Napkin → Business Model Canvas → Pitch → PM → Product Owner → Analyst → UI/UX → Scrum sprints + CI/CD → QA → UAT → Real users.\n\nPlay it free: https://yushabdullah.github.io/initiate/\n\n#INITIATE #ProductManagement #Scrum #DevOps #Startup`;
}
function reportScreen(){
  const G=gradeInfo(), L=S.launch||computeLaunch();
  const img=h('img',{class:'cardimg',alt:`Report card: ${S.player.name}, ${I().name}, grade ${G.grade}, ${G.rank}`});
  let cardCanvas=null, dl=null;
  const fname=`INITIATE-scorecard-${(S.player.name||'player').replace(/[^A-Za-z0-9]+/g,'-')}.png`;
  const saveNote=h('p',{class:'real',style:'text-align:center'},'To save it: press and hold the card on a phone, or right-click it and choose "Save image" on a computer.');
  const saveBtn=h('button',{class:'btn',hidden:true,onclick:async()=>{
    if(!cardCanvas||!dl) return;
    try{
      const blob=await new Promise((res,rej)=>cardCanvas.toBlob(b=>b?res(b):rej(new Error('blob')),'image/png'));
      await dl.save({filename:fname,data:blob}); say.set('Scorecard saved. Attach it to your post.','good');
    }catch(e){
      const c=e&&e.code;
      if(c==='declined') say.set('Save cancelled.');
      else if(c==='rate_limited') say.set('A save prompt is already open.');
      else { saveBtn.hidden=true; saveNote.hidden=false; say.set('Saving is not available here. Press and hold the card image instead.','bad'); }
    }
  }},'Save or share scorecard image');
  makeCard().then(c=>{ cardCanvas=c; img.src=c.toDataURL('image/png'); }).catch(()=>{ img.alt='The report card image could not be drawn in this browser.'; });
  if(!window.claude){ dl={save:async({filename,data})=>{ const f=new File([data],filename,{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[f]})&&matchMedia('(pointer:coarse)').matches){ try{ await navigator.share({files:[f],text:postText()}); return; }catch(e){ if(e&&e.name==='AbortError'){ const x=new Error('declined'); x.code='declined'; throw x; } } }
      const u=URL.createObjectURL(data), a=h('a',{href:u,download:filename}); document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); }};
    saveBtn.hidden=false; saveNote.textContent='On a phone this opens your share sheet, so you can post the image straight to LinkedIn, WhatsApp, Instagram and more.'; }
  try{ window.claude?.use?.('downloads').then(d=>{ if(d){ dl=d; saveBtn.hidden=false; saveNote.textContent='On the Claude phone app, this opens your share sheet, so you can post the image straight to LinkedIn, WhatsApp, Instagram and more.'; } }).catch(()=>{}); }catch(e){}
  const text=postText();
  const ta=h('textarea',{class:'posttext',id:'posttext','aria-label':'Post text',readonly:true},text);
  const say=sayBox('Step 1: save the scorecard image. Step 2: tap a platform below (the text is filled in for you). Step 3: attach the image to your post.');
  const enc=encodeURIComponent(text);
  const link=(label,href,col,light)=>h('a',{class:'btn small',href,target:'_blank',rel:'noopener noreferrer',style:`--c:${col};--t:${light?'var(--ink)':'#fff'}`},label);
  const copy=h('button',{class:'btn small sec',onclick:()=>{ const ok=()=>say.set('Post text copied. Paste it into your post.','good');
    try{ navigator.clipboard.writeText(text).then(ok,()=>{ ta.select(); say.set('Copy did not work here. The text is selected, so copy it yourself.','bad'); }); }catch(e){ ta.select(); say.set('The text is selected. Copy it yourself.','bad'); } }},'Copy post text');
  const weakest=[...STG].sort((a,b)=>(S.scores[a.id]??0)-(S.scores[b.id]??0)).slice(0,2);
  return [
    h('section',{class:'intro'},playerAv('bob'),h('div',{class:'sheet'},h('div',{class:'role'},'Impact report'),h('h2',{},`${I().name}: grade ${G.grade}, ${G.rank}`),h('p',{},`From a scribble on a napkin to ${L.active} customers and ${fmtRM(L.revenue)} a month in ${S.weeks} weeks. Average score ${G.avg}/100.`))),
    sheet(h('h3',{},'Your report card'),img,h('div',{class:'actions',style:'justify-content:center'},saveBtn),saveNote),
    sheet(h('h3',{},'Share it'),say,h('div',{class:'share'},
      link('LinkedIn',`https://www.linkedin.com/feed/?shareActive=true&text=${enc}`,'#0a66c2'),
      link('X',`https://x.com/intent/post?text=${enc}`,'#23262e'),
      link('WhatsApp',`https://wa.me/?text=${enc}`,'#1f9e5a'),
      link('Threads',`https://www.threads.net/intent/post?text=${enc}`,'#5d6271'),
      copy),ta),
    sheet(h('h3',{},'Score by stage'),STG.map(st=>{ const v=S.scores[st.id]??0; return h('div',{class:'rep-row'},h('span',{},STG_TITLE[st.id]),h('div',{class:'bar'},h('i',{style:`width:${v}%;--c:${v>=75?'var(--leaf)':v>=50?'var(--mustard)':'var(--tomato)'}`})),h('span',{style:'text-align:right'},v)); })),
    sheet(h('h3',{},'What to improve next time'),h('ul',{class:'lines'},weakest.map(st=>h('li',{},h('b',{},STG_TITLE[st.id]+': '),LESSON[st.id])))),
    sheet(h('h3',{},`Badges (${S.badges.length} of ${BADGES.length})`),h('div',{class:'badges'},BADGES.map(b=>h('span',{class:'badge'+(S.badges.includes(b.id)?'':' off'),style:`--c:${b.c}`,title:b.how},b.name)))),
    h('div',{class:'actions',style:'justify-content:center'},
      h('button',{class:'btn',onclick:()=>{ const p=S.player, id=S.ideaId, xp=S.xp, lv=S.level, bd=S.badges; S=newState(p); S.ideaId=id; S.oneLiner=I().pitch; S.xp=xp; S.level=lv; S.badges=bd; S.screen='map'; prevNums=null; save(); render(); }},`Replay ${I().name}`),
      h('button',{class:'btn sec',onclick:()=>{ const p=S.player, xp=S.xp, lv=S.level, bd=S.badges; S=newState(p); S.xp=xp; S.level=lv; S.badges=bd; prevNums=null; save(); render(); }},'Try another idea')),
  ];
}

/* ================= boot ================= */
try{ window.claude?.hot?.snapshot?.(()=>({saved:lastSaved})); }catch(e){}
function start(d){
  try{ if(d&&d.saved){ S=JSON.parse(d.saved); lastSaved=d.saved; if(S&&S.screen==='stage') S.screen='map'; } }catch(e){ S=null; }
  render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
