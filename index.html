<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="INITIATE: take a scattered idea through a real product lifecycle. Pitch, Scrum, DevOps, QA, launch day. A free browser game.">
<meta property="og:title" content="INITIATE: a product lifecycle game">
<meta property="og:description" content="Take a scattered idea from napkin to launch day. Pitch, Scrum, DevOps, QA and real users.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://yushabdullah.github.io/initiate/">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#6BE683">
<title>INITIATE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: a craft desk. Green cutting mat background, every screen is a sheet of paper laid on it; game pieces are coloured paper cutouts with tape. One centred reading column (max 780px). Single bright look by choice. */
:root{
  /* Fealty base: mint canvas, white cards, one mint CTA, green-tinted depth. Paper cutout pieces sit on top. */
  --canvas:#F6FEF6; --tint:#E3F8E6; --mint:#6BE683; --mint-hover:#55D86C; --on-mint:#003503; --accent:#1CBB6C; --border:#DDEBDF;
  --paper:#ffffff; --paper-2:#F1F7F1; --paper-3:#DDEBDF;
  --ink:#0F1A12; --ink-soft:#4E544F; --night:#262828;
  --tomato:#e5533d; --mustard:#f2b632; --sky:#4aa3df; --cobalt:#3557c6; --leaf:#2f9a55; --pink:#ef8db0; --lilac:#9478d1; --teal:#1f9e93; --kraft:#c9a46c;
  --good:#1A7F55; --bad:#C42A36; --warn:#9A6A00;
  --display:'Outfit',ui-sans-serif,system-ui,sans-serif;
  --body:'Outfit',ui-sans-serif,system-ui,sans-serif;
  --hand:'Caveat','Comic Sans MS',cursive;
  --cut:14px 7px 12px 9px / 9px 13px 7px 12px;
  --e1:0 4px 16px rgba(16,40,20,.06); --e2:0 12px 32px rgba(16,40,20,.08); --e3:0 24px 60px rgba(16,40,20,.14);
  --lift:0 2px 0 rgba(16,40,20,.06),0 10px 20px -8px rgba(16,40,20,.3);
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:radial-gradient(620px 420px at 92% -6%,var(--tint),transparent 70%),radial-gradient(520px 420px at -12% 38%,var(--tint),transparent 70%),var(--canvas);
  background-attachment:fixed;
  color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
}
#app{max-width:820px;margin:0 auto;padding-block:16px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:clamp(24px,4.4vw,32px);line-height:1.12}
h3{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.2}
p{margin:0}
.label{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft)}

/* ---------- paper ---------- */
.sheet{position:relative;background:var(--paper);border-radius:6px;box-shadow:var(--lift);padding:22px;display:grid;gap:14px;min-width:0}
.sheet.tilt-l{transform:rotate(-.5deg)} .sheet.tilt-r{transform:rotate(.4deg)}
.tape::before{content:"";position:absolute;top:-12px;left:50%;width:110px;height:26px;transform:translateX(-50%) rotate(-3deg);background:rgba(242,182,50,.55);box-shadow:0 1px 2px rgba(0,0,0,.08);pointer-events:none}
.tape.t2::before{left:18%;background:rgba(239,141,176,.55);transform:rotate(4deg)}
.scrap{--c:var(--sky);--t:#fff;position:relative;display:block;background:var(--c);color:var(--t);border:0;border-radius:var(--cut);padding:12px 14px;text-align:left;font-weight:700;box-shadow:var(--lift);transform:rotate(var(--r,0deg));transition:transform .15s ease,box-shadow .15s ease}
.scrap.light{--t:var(--ink)}
button.scrap:not(:disabled):hover{transform:rotate(var(--r,0deg)) translateY(-2px)}

.btn{--c:var(--mustard);--t:var(--ink);font-family:var(--display);font-weight:700;font-size:19px;padding:14px 26px;min-height:54px;border-radius:12px 8px 13px 9px / 9px 13px 8px 12px;border:0;background:var(--c);color:var(--t);box-shadow:0 4px 0 rgba(0,0,0,.22),0 10px 16px -10px rgba(0,0,0,.5);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:not(:disabled):hover{transform:translateY(-1px)}
.btn:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.btn.sec{--c:var(--paper-2);--t:var(--ink)}
.btn.blue{--c:var(--cobalt);--t:#fff}
.btn.red{--c:var(--tomato);--t:#fff}
.btn.small{font-size:16px;padding:10px 16px;min-height:44px}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.say{min-height:1.6em;font-weight:700;font-size:15px;padding:8px 12px;border-radius:8px;background:var(--paper-2);color:var(--ink-soft)}
.say.good{background:#e3f4e8;color:#1f6e3b}.say.bad{background:#fde6e1;color:#a52d1b}
.how{display:flex;gap:10px;align-items:flex-start;font-size:15px;background:#fff7dc;border-radius:8px;padding:10px 12px}
.how b{font-family:var(--display);font-weight:600;white-space:nowrap}
.real{font-size:14px;color:var(--ink-soft)}
.real b{color:var(--ink)}

/* ---------- avatar (paper sticker) ---------- */
.av{display:block;flex:none}
.av svg{display:block;width:100%;height:auto;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 6px 6px rgba(0,0,0,.3))}
.av.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(1deg)}}

/* ---------- HUD ---------- */
.hud{display:grid;gap:10px;background:var(--paper);border-radius:6px;box-shadow:var(--lift);padding:12px 14px}
.hud-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hud .who{display:flex;align-items:center;gap:10px;flex:1;min-width:200px}
.hud .who .av{width:44px}
.hud .nm{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.1}
.hud .sub{font-size:13px;color:var(--ink-soft);font-weight:700}
.xp{flex:1;min-width:150px;display:grid;gap:3px}
.xp .bar{height:12px;border-radius:6px;background:var(--paper-3);overflow:hidden}
.xp .bar i{display:block;height:100%;background:var(--leaf);border-radius:6px;transition:width .6s}
.xp small{font-size:12px;font-weight:800;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;background:var(--paper-2);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip span{color:var(--ink-soft);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.delta{position:absolute;right:-4px;top:-14px;font-size:12px;font-weight:800;border-radius:6px;padding:0 5px;color:#fff;animation:deltaUp 1.6s ease forwards;pointer-events:none}
.delta.up{background:var(--good)}.delta.down{background:var(--bad)}
@keyframes deltaUp{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

/* ---------- title ---------- */
.title{display:grid;gap:22px;justify-items:center;text-align:center;padding-block:20px 0}
.letters{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.letter{font-family:var(--display);font-weight:700;font-size:clamp(40px,10vw,88px);line-height:1;width:1em;padding:.12em 0 .16em;text-align:center;background:var(--c);color:#fff;border-radius:var(--cut);box-shadow:var(--lift);transform:rotate(var(--r));animation:cutIn .6s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i) * 80ms)}
.letter.dark{color:var(--ink)}
@keyframes cutIn{0%{opacity:0;transform:translateY(-40px) rotate(-20deg)}100%{opacity:1;transform:rotate(var(--r))}}
.tagline{color:#fff;font-size:clamp(17px,2.4vw,20px);max-width:32em}
.tagline b{font-family:var(--display);font-weight:600}
.phases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%}
.phase{padding:12px 10px;text-align:center;font-weight:700;font-size:14px}
.phase b{display:block;font-family:var(--display);font-size:20px;font-weight:700}

/* ---------- character ---------- */
.pick2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ptile{background:var(--paper-2);border:3px solid transparent;border-radius:12px;padding:14px;display:grid;justify-items:center;gap:6px;text-align:center}
.ptile .av{width:110px}
.ptile[aria-pressed="true"]{border-color:var(--cobalt);background:#e8eefc}
.ptile b{font-family:var(--display);font-size:20px}
.ptile small{font-size:14px;color:var(--ink-soft)}
.custom{display:grid;grid-template-columns:160px minmax(0,1fr);gap:20px;align-items:start}
.custom .preview{background:var(--paper-2);border-radius:12px;padding:12px}
.opt-row{display:grid;gap:6px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--paper-3);background:var(--c)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--cobalt)}
.pill{border:0;background:var(--paper-2);border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px;min-height:40px}
.pill[aria-pressed="true"]{background:var(--ink);color:#fff}
.field{display:grid;gap:4px}
.field input{border:2px solid var(--paper-3);border-radius:10px;padding:10px 12px;background:#fff;font-weight:700;min-height:48px;width:100%}
.field input:focus{border-color:var(--cobalt);outline:none}

/* ---------- idea pick ---------- */
.ideas{display:grid;gap:14px}
.idea{padding:16px 18px;display:grid;gap:4px}
.idea .k{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;opacity:.9}
.idea .n{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1}
.idea .d{font-weight:600;font-size:15px}

/* ---------- journey map ---------- */
.map{display:grid;gap:0;position:relative;padding-block:6px}
.ph-h{font-family:var(--hand);font-size:30px;font-weight:700;color:var(--ink-soft);margin:10px 0 2px;line-height:1}
.node{display:flex;align-items:center;gap:14px;padding:8px 0;position:relative}
.node:nth-child(even){padding-left:28px}
.dot{width:56px;height:56px;flex:none;border-radius:50% 46% 52% 48%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;background:var(--paper-3);color:var(--ink-soft);box-shadow:0 3px 0 rgba(0,0,0,.1)}
.node.done .dot{background:var(--leaf);color:#fff}
.node.next .dot{background:var(--mustard);color:var(--ink);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.node .meta{flex:1;min-width:0}
.node .meta b{font-family:var(--display);font-weight:600;font-size:18px;display:block;line-height:1.2}
.node .meta small{font-size:14px;color:var(--ink-soft)}
.node.locked{opacity:.55}
.stars{color:var(--warn);letter-spacing:1px;font-size:15px;white-space:nowrap}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{--c:var(--lilac);background:var(--c);color:#fff;border-radius:999px 999px 999px 4px;padding:5px 12px;font-size:13px;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.badge.off{background:var(--paper-2);color:var(--ink-soft);box-shadow:none}

/* ---------- intro ---------- */
.intro{display:flex;gap:16px;align-items:flex-end}
.intro .av{width:96px}
.intro .sheet{flex:1}
.intro .sheet::after{content:"";position:absolute;left:-11px;bottom:28px;border:11px solid transparent;border-right-color:var(--paper);border-left:0}
.role{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--cobalt)}

/* ---------- drag and drop ---------- */
.drag{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.drag.lifted{opacity:.3}
.drag.picked{outline:4px solid var(--ink);outline-offset:3px}
.ghost{cursor:grabbing;box-shadow:0 18px 30px -10px rgba(0,0,0,.55)!important;transition:none!important}
[data-drop]{transition:background .15s, box-shadow .15s}
body.picking [data-drop]:not(.full){box-shadow:0 0 0 3px var(--cobalt) inset;cursor:pointer}
[data-drop].over{background:#dfe8fb!important;box-shadow:0 0 0 4px var(--cobalt) inset!important}
.bounce{animation:bounce .45s}
@keyframes bounce{20%{transform:translateX(-8px) rotate(-3deg)}50%{transform:translateX(8px) rotate(3deg)}80%{transform:translateX(-3px)}}
.snap{animation:snap .35s}
@keyframes snap{0%{transform:scale(.85)}70%{transform:scale(1.05)}100%{transform:none}}

/* ---------- napkin ---------- */
.tray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:6px 0}
.tray .scrap{max-width:330px;font-size:15px}
.nap-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
.nap-wrap .tray{justify-content:flex-start}
.napkin{background:#fff;border-radius:4px;padding:18px 18px 22px;box-shadow:var(--lift);transform:rotate(-.6deg);
  background-image:linear-gradient(90deg,transparent calc(50% - 1px),rgba(0,0,0,.05) 50%,transparent calc(50% + 1px)),linear-gradient(transparent calc(50% - 1px),rgba(0,0,0,.05) 50%,transparent calc(50% + 1px));
  border:2px dashed var(--paper-3);display:grid;gap:10px}
.napkin .hand{font-family:var(--hand);font-size:30px;font-weight:700;line-height:1.1;color:var(--cobalt)}
.napkin input{font-family:var(--hand);font-size:24px;font-weight:600;border:0;border-bottom:2px solid var(--paper-3);background:transparent;padding:4px 2px;width:100%;color:var(--ink)}
.napkin input:focus{outline:none;border-bottom-color:var(--cobalt)}
.nline{border-radius:8px;padding:8px 10px;min-height:64px;display:grid;gap:2px;background:rgba(241,239,233,.6);text-align:left;border:0;width:100%}
.nline .k{font-family:var(--hand);font-size:24px;font-weight:700;color:var(--tomato);line-height:1}
.nline .v{font-size:15px;color:var(--ink-soft);font-weight:600}
.nline.full .v{color:var(--ink);font-weight:700}

/* ---------- BMC ---------- */
.deck{display:grid;justify-items:center;gap:8px;padding:8px 0 4px}
.deck .scrap{max-width:420px;width:100%;font-size:17px;padding:16px 18px;text-align:center}
.deck .left{font-size:13px;font-weight:800;color:var(--ink-soft)}
.bmc{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-areas:"kp kp ka ka vp vp cr cr cs cs" "kp kp kr kr vp vp ch ch cs cs" "co co co co co rs rs rs rs rs";gap:6px;background:var(--ink);padding:6px;border-radius:8px}
.blk{background:var(--paper);border:0;border-radius:4px;padding:8px;min-height:120px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.blk b{font-family:var(--display);font-weight:600;font-size:14px;line-height:1.15}
.blk small{font-size:12px;color:var(--ink-soft);line-height:1.3}
.blk .placed{margin-top:auto;font-size:12.5px;font-weight:700;background:var(--c,var(--mustard));border-radius:6px 3px 7px 4px;padding:6px 7px;color:var(--ink);line-height:1.3;transform:rotate(-1deg)}
.blk.full{background:#fbf8ef}

/* ---------- pitch ---------- */
.boardroom{display:flex;justify-content:center;gap:12px;align-items:flex-end}
.boardroom .seat{display:grid;justify-items:center;gap:4px;font-size:13px;font-weight:800}
.boardroom .av{width:82px;transition:transform .2s}
.boardroom .seat.talk .av{transform:translateY(-8px) scale(1.06)}
.desk{height:18px;background:var(--kraft);border-radius:4px 7px 3px 6px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.q{font-size:19px;font-weight:700;background:var(--paper-2);border-radius:10px;padding:12px 16px}
.q small{display:block;font-size:13px;color:var(--cobalt);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.choices{display:grid;gap:10px}
.choice{font-size:16px;padding:14px 16px;min-height:52px}
.meter{position:relative;height:22px;background:var(--paper-2);border-radius:11px;overflow:hidden}
.meter>i{display:block;height:100%;width:0;background:var(--leaf);transition:width .5s ease}
.meter>em{position:absolute;top:0;bottom:0;width:3px;background:var(--ink)}
.meter-l{display:flex;justify-content:space-between;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.stamp{font-family:var(--display);font-weight:700;font-size:clamp(28px,6vw,44px);color:var(--good);border:6px solid currentColor;border-radius:14px 8px 12px 9px;padding:4px 18px;transform:rotate(-7deg);justify-self:center;animation:stamp .45s cubic-bezier(.3,1.6,.5,1) both}
.stamp.no{color:var(--bad)}
@keyframes stamp{0%{transform:rotate(-7deg) scale(2.2);opacity:0}100%{transform:rotate(-7deg) scale(1);opacity:1}}

/* ---------- PM ---------- */
.member{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;font-size:15px}
.member small{font-weight:600;opacity:.9;display:block;font-size:13px}
.member.off{--c:var(--paper-2);--t:var(--ink-soft)}
.toggle-note{font-size:13px;font-weight:800;white-space:nowrap}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:10px;border:0;background:var(--ink);color:#fff;font-weight:800;font-size:22px;line-height:1}
.stepper b{min-width:1.6em;text-align:center;font-size:20px;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--paper-3);font-size:15px;font-variant-numeric:tabular-nums}
.row b.bad{color:var(--bad)}

/* ---------- PO ---------- */
.story-row{display:grid;gap:8px;padding:12px;border-radius:10px;background:var(--paper-2)}
.story-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;font-weight:700}
.tags{display:flex;gap:4px;flex:none}
.tag{font-size:12px;font-weight:800;background:#fff;border-radius:6px;padding:2px 7px;white-space:nowrap;color:var(--ink-soft)}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.seg button{border:0;border-radius:8px;padding:8px 4px;min-height:42px;font-weight:800;font-size:14px;background:#fff}
.seg button[aria-pressed="true"][data-t="M"]{background:var(--tomato);color:#fff}
.seg button[aria-pressed="true"][data-t="S"]{background:var(--mustard)}
.seg button[aria-pressed="true"][data-t="C"]{background:var(--sky);color:#fff}
.seg button[aria-pressed="true"][data-t="W"]{background:var(--ink-soft);color:#fff}

/* ---------- analyst ---------- */
.req{width:100%;text-align:left;border:3px solid var(--paper-2);background:#fff;border-radius:10px;padding:12px 14px;display:grid;gap:6px;font-weight:700;min-height:52px}
.req.marked{border-color:var(--warn);background:#fff6e6}
.req .verdict{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.req .fix{font-size:14px;font-weight:600;background:#e3f4e8;border-radius:8px;padding:8px 10px}
.good-t{color:var(--good)}.bad-t{color:var(--bad)}

/* ---------- UX ---------- */
.ux-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:start}
.phone{width:250px;border:10px solid var(--ink);border-radius:30px;background:var(--paper-2);padding:14px 10px 18px;display:grid;gap:8px}
.phone .notch{width:64px;height:6px;border-radius:3px;background:var(--ink);justify-self:center}
.pslot{min-height:56px;border:2px dashed #b9b4a8;border-radius:10px;background:#fff;font-size:13px;padding:8px 10px;text-align:left;color:var(--ink-soft);font-weight:700;width:100%}
.pslot.full{border:0;padding:0;background:none}
.pslot.full .scrap{font-size:13px;width:100%;--r:0deg}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;align-content:start}
.palette .scrap{font-size:14px;width:100%}
.palette .scrap.used{opacity:.25;pointer-events:none}

/* ---------- dev ---------- */
.board3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.col{background:var(--paper-2);border-radius:10px;padding:10px;min-height:150px;min-width:0;display:grid;align-content:start;gap:8px}
.col h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft)}
.story{font-size:13px;padding:8px 10px;line-height:1.3;overflow-wrap:anywhere}
.story i{font-style:normal;font-size:11px;font-weight:800;background:rgba(255,255,255,.3);border-radius:4px;padding:0 5px;margin-left:4px;white-space:nowrap}
.pipe{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pnode{background:var(--paper-3);color:var(--ink-soft);font-size:13px;font-weight:800;padding:8px 12px;border-radius:9px 5px 8px 6px}
.pnode.run{background:var(--mustard);color:var(--ink);animation:pulse .6s infinite}
.pnode.ok{background:var(--leaf);color:#fff}
.pnode.fail{background:var(--tomato);color:#fff}
.arrow{color:var(--ink-soft);font-weight:800}
.ev-q{font-size:18px;font-weight:700}
.ev-r{font-size:15px;background:var(--paper-2);border-radius:10px;padding:10px 12px}
.log{margin:0;padding-left:20px;font-size:15px;color:var(--ink-soft);display:grid;gap:4px}
.warn{color:var(--bad);font-weight:700;font-size:15px}

/* ---------- QA ---------- */
.qa-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-weight:800;font-variant-numeric:tabular-nums}
.timer{font-family:var(--display);font-weight:700;font-size:26px}
.timer.low{color:var(--bad)}
.app-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:470px;width:100%;margin:0 auto;background:var(--paper-2);padding:12px;border-radius:14px}
.tile{--c:var(--cobalt);font-size:14px;text-align:center;padding:16px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;min-height:54px}
.tile.act{--c:var(--leaf)}
.tile.b-tilt{--r:5deg}
.tile.b-color{--c:#c4479a}
.tile.squashed{opacity:.5;text-decoration:line-through}
.tile.missed{outline:3px dashed var(--bad);outline-offset:2px}
.locked-grid{filter:grayscale(.7) blur(1.5px);pointer-events:none}
.switch{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.switch input{width:22px;height:22px;accent-color:var(--cobalt)}

/* ---------- UAT ---------- */
.fcard{border:3px solid var(--paper-2);border-radius:12px;padding:12px 14px;display:grid;gap:8px;background:#fff}
.fcard .who{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
.fcard .txt{font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:0;border-radius:999px;padding:8px 14px;background:var(--paper-2);font-size:14px;font-weight:800;min-height:42px}
.opt[aria-pressed="true"]{background:var(--ink);color:#fff}

/* ---------- beta ---------- */
.street{position:relative;height:200px;border-radius:8px;overflow:hidden;background:#bfe3f7}
.street .sun{position:absolute;left:8%;top:18px;width:46px;height:46px;border-radius:50%;background:var(--mustard)}
.street .bld{position:absolute;bottom:40px;background:var(--c);border-radius:6px 9px 0 0}
.street .road{position:absolute;left:0;right:0;bottom:0;height:42px;background:#8d96a3}
.street .shop{position:absolute;right:7%;bottom:40px;width:150px;height:96px;background:var(--tomato);border-radius:5px 8px 0 0;display:grid;justify-items:center}
.street .sign{margin-top:-14px;background:var(--mustard);font-family:var(--display);font-weight:700;font-size:14px;padding:4px 10px;border-radius:6px 3px 7px 4px;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;transform:rotate(-2deg)}
.street .door{width:34px;height:52px;background:var(--ink);border-radius:4px 4px 0 0;align-self:end}
.walker{position:absolute;bottom:18px;left:-60px;width:44px;animation:walk 3.4s linear forwards}
@keyframes walk{90%{opacity:1}100%{left:calc(93% - 80px);opacity:0}}
.walker .av{animation:step .35s ease-in-out infinite}
@keyframes step{50%{transform:translateY(-3px)}}
.reviews{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.rev{display:flex;gap:10px;align-items:center;background:var(--paper-2);border-radius:12px;padding:10px 12px;animation:snap .4s both}
.rev .av{width:46px}
.rev p{font-size:14px;font-weight:600}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.metric{padding:12px 14px}
.metric span{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;opacity:.85}
.metric b{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}

/* ---------- result + report ---------- */
.score-big{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.score-num{font-family:var(--display);font-weight:700;font-size:64px;line-height:1}
.score-num small{font-size:20px;color:var(--ink-soft)}
.studs{display:flex;gap:6px}
.studs i{width:28px;height:28px;border-radius:50% 45% 52% 48%;background:var(--paper-3)}
.studs i.on{background:var(--mustard)}
.levelup{font-family:var(--display);font-weight:700;font-size:22px;background:var(--leaf);color:#fff;border-radius:10px 6px 11px 7px;padding:8px 14px;justify-self:start;transform:rotate(-2deg);animation:stamp .45s both}
.lines{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15px}
.rep-row{display:grid;grid-template-columns:140px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:14px;border-radius:7px;background:var(--paper-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px;background:var(--c,var(--leaf))}
.cardimg{width:100%;max-width:520px;justify-self:center;border-radius:6px;box-shadow:var(--lift);background:var(--paper-2);aspect-ratio:1080/1350}
.share{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.share a{text-decoration:none}
.posttext{width:100%;min-height:110px;border:2px solid var(--paper-3);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;resize:vertical;background:#fff}


/* ===== v3: Fealty blend ===== */
h2{font-weight:600;letter-spacing:-.02em}
h3{font-weight:600}
.sheet{border-radius:24px;box-shadow:var(--e2);padding:28px;animation:rise .45s var(--ease) both}
#app>*:nth-child(2){animation-delay:.06s}#app>*:nth-child(3){animation-delay:.12s}#app>*:nth-child(4){animation-delay:.18s}#app>*:nth-child(5){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.intro .sheet{animation:none}
.intro{animation:rise .45s var(--ease) both}
.hud{border-radius:24px;box-shadow:var(--e1);border:0}
.btn{--c:var(--mint);--t:var(--on-mint);border-radius:8px;font-weight:600;font-size:17px;min-height:48px;box-shadow:var(--e1);transition:transform .1s ease,filter .1s ease}
.btn:not(:disabled):hover{transform:none;filter:brightness(.95)}
.btn:not(:disabled):active{transform:scale(.98);box-shadow:var(--e1)}
.btn.sec{--c:#fff;--t:var(--ink);box-shadow:inset 0 0 0 1.5px var(--border),var(--e1)}
.how{background:var(--tint);border-radius:12px}
.say{background:var(--paper-2);border-radius:12px}
.chip{background:var(--paper-2)}
.xp .bar{height:8px}
.xp .bar i{background:var(--accent)}
.meter>i{background:var(--accent)}
.role{color:var(--good)}
.label{color:var(--ink-soft)}
.studs i.on{background:var(--mint)}
.levelup{background:var(--night);color:#fff;border-radius:12px}
.badge{border-radius:999px}
.node.done .dot{background:var(--accent)}
.node.next .dot{background:var(--mint);color:var(--on-mint)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:24px;align-items:center;padding-block:16px 4px}
.hero-text{display:grid;gap:22px;position:relative}
.logo-row{display:flex;gap:3px;align-items:center}
.logo-row span{font-family:var(--display);font-weight:700;font-size:20px;width:30px;height:34px;display:grid;place-items:center;color:#fff;background:var(--c);border-radius:var(--cut);transform:rotate(var(--r));box-shadow:var(--lift);animation:cutIn .6s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i) * 70ms)}
.logo-row span.dark{color:var(--ink)}
.display{font-family:var(--display);font-weight:600;font-size:clamp(42px,7vw,72px);line-height:1.06;letter-spacing:-.025em;animation:rise .6s var(--ease) both}
.display em{font-style:normal;position:relative;white-space:nowrap}
.display em svg{position:absolute;left:0;right:0;bottom:-.18em;width:100%;height:.32em;overflow:visible}
.display em path{stroke:var(--mint);stroke-width:5;fill:none;stroke-linecap:round;stroke-dasharray:400;stroke-dashoffset:400;animation:draw .9s .5s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.lead{font-size:18px;color:var(--ink-soft);max-width:34em}
.tchips{display:flex;gap:0;flex-wrap:wrap}
.tchip{background:#fff;border-radius:12px;padding:10px 16px;box-shadow:var(--e1);transform:rotate(-4deg);margin:0 -4px 0 0;display:flex;align-items:baseline;gap:6px;animation:drop .5s var(--ease) both;animation-delay:calc(.3s + var(--i) * 60ms)}
.tchip:nth-child(2){transform:rotate(3deg) translateY(6px)}
.tchip b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tchip span{font-size:14px;color:var(--ink-soft)}
@keyframes drop{from{opacity:0;transform:translateY(-16px)}}
.fan{position:relative;height:360px}
.fan .card{position:absolute;left:50%;top:50%;width:210px;height:280px;margin:-140px 0 0 -105px;border-radius:16px;box-shadow:var(--e3);padding:18px;display:grid;align-content:start;gap:8px;animation:fan .7s var(--ease) both;animation-delay:.25s}
.fan .c1{background:#fff;--a:-14deg;--x:-70px}
.fan .c2{background:var(--night);color:#fff;--a:0deg;--x:0px;z-index:1}
.fan .c3{background:rgba(255,255,255,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);--a:13deg;--x:70px;z-index:2}
@keyframes fan{from{transform:rotate(0) translateX(0)}to{transform:rotate(var(--a)) translateX(var(--x))}}
.fan .card{transform:rotate(var(--a)) translateX(var(--x))}
.fan .k{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;opacity:.7}
.fan .hand{font-family:var(--hand);font-size:26px;font-weight:700;line-height:1.05;color:var(--cobalt)}
.fan .mini-bmc{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;height:120px}
.fan .mini-bmc i{border-radius:3px;background:rgba(255,255,255,.14)}
.fan .mini-bmc i:nth-child(3){background:var(--mint)}
.fan .grade{font-size:72px;font-weight:700;line-height:1;color:var(--ink)}
.phase-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

/* footer + pages */
.foot{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;align-items:center;padding:8px 4px;font-size:15px;color:var(--ink-soft)}
.foot nav{display:flex;flex-wrap:wrap;gap:6px 18px}
.foot a{color:var(--ink-soft);text-decoration:none;font-weight:500;padding:6px 0}
.foot a:hover{color:var(--ink)}
.snd{border:0;background:#fff;border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px;box-shadow:var(--e1);min-height:40px}
.doc{display:grid;gap:14px;max-width:68ch}
.doc h3{margin-top:8px}
.doc p,.doc li{color:var(--ink-soft)}
.doc ul{margin:0;padding-left:20px;display:grid;gap:6px}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tcard{display:flex;gap:12px;align-items:center;background:var(--paper-2);border-radius:16px;padding:12px}
.tcard .av{width:58px}
.tcard b{display:block;font-weight:600}
.tcard small{color:var(--ink-soft);font-size:14px;line-height:1.35;display:block}

/* production cycle */
.cycle{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
.cycle .ringbox svg{width:250px;height:250px;overflow:visible}
.cycle .ring{fill:none;stroke:var(--border);stroke-width:3;stroke-dasharray:6 8;animation:ringspin 8s linear infinite;transform-origin:125px 125px}
@keyframes ringspin{to{transform:rotate(360deg)}}
.cycle .nd circle{fill:#fff;stroke:var(--border);stroke-width:2}
.cycle .nd text{font-family:var(--body);font-size:12px;font-weight:600;fill:var(--ink-soft);text-anchor:middle}
.cycle .nd.done circle{fill:var(--tint);stroke:var(--accent)}
.cycle .nd.on circle{fill:var(--mint);stroke:var(--on-mint);animation:nodepop .5s 1.1s var(--ease) both;transform-box:fill-box;transform-origin:center}
.cycle .nd.on text{fill:var(--ink)}
@keyframes nodepop{0%{transform:scale(1)}50%{transform:scale(1.45)}100%{transform:scale(1.15)}}
.cycle .runner{transform-origin:125px 125px;animation:orbit 1.2s var(--ease) forwards}
@keyframes orbit{from{transform:rotate(var(--from))}to{transform:rotate(var(--to))}}
.cycle .center{font-family:var(--display);font-weight:700;font-size:15px;text-anchor:middle;fill:var(--ink)}
.cycle-text{display:grid;gap:10px}
.cycle-text .av{width:84px;animation:popin .5s 1.2s var(--ease) both}
@keyframes popin{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.08)}100%{transform:none}}
.cycle-bar{height:6px;border-radius:999px;background:var(--tint);overflow:hidden}
.cycle-bar i{display:block;height:100%;background:var(--accent);animation:fillbar 2.6s linear forwards}
@keyframes fillbar{from{width:0}to{width:100%}}

/* pop-ups + confetti */
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit}
.confetti i{position:absolute;top:-14px;left:var(--x);width:10px;height:6px;border-radius:2px;background:var(--c);transform:rotate(var(--r));animation:fall var(--d) cubic-bezier(.3,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(var(--y)) rotate(calc(var(--r) + 540deg));opacity:0}}
.popup{position:relative;display:inline-flex;align-items:center;gap:8px;justify-self:start;background:var(--night);color:#fff;border-radius:12px;padding:8px 14px;font-weight:600;animation:popin .45s var(--ease) both}
.pop-in{animation:popin .45s var(--ease) both}

/* pitch simulation */
.room{position:relative;background:var(--night);border-radius:24px;padding:18px;display:grid;gap:14px;overflow:hidden;box-shadow:var(--e3);animation:rise .45s var(--ease) both}
.room::before{content:"";position:absolute;left:10%;right:10%;top:-30%;height:90%;background:radial-gradient(closest-side,rgba(255,255,220,.16),transparent);pointer-events:none}
.room-top{display:flex;justify-content:space-between;align-items:center;color:#cfd6d0;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;position:relative}
.live{display:inline-flex;align-items:center;gap:6px;color:#fff}
.live::before{content:"";width:9px;height:9px;border-radius:50%;background:#ff5a4f;animation:blinkdot 1s infinite}
@keyframes blinkdot{50%{opacity:.25}}
.screen{position:relative;background:#fff;border-radius:12px;min-height:190px;padding:20px 22px;display:grid;gap:6px;align-content:center;box-shadow:0 0 0 6px #3a3d3d}
.screen .kicker{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--good)}
.screen h3{font-size:clamp(22px,3.6vw,30px);letter-spacing:-.02em}
.screen p{font-size:17px;color:var(--ink-soft);min-height:2.6em}
.screen .snum{position:absolute;right:14px;bottom:10px;font-size:12px;color:var(--ink-soft);font-weight:600}
.screen.flip{animation:slidein .45s var(--ease)}
@keyframes slidein{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.screen .stampwrap{display:grid;place-items:center}
.stage-row{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding-top:44px}
.presenter{display:grid;justify-items:center;gap:4px;color:#fff;font-size:12px;font-weight:600}
.presenter .av{width:78px}
.presenter.talk .av{animation:talk .45s ease-in-out infinite}
@keyframes talk{50%{transform:translateY(-4px) rotate(-1deg)}}
.boardrow{display:flex;gap:10px}
.bm{position:relative;display:grid;justify-items:center;gap:4px;color:#fff;font-size:12px;font-weight:600}
.bm .av{width:62px;transition:transform .2s}
.bm.lean .av{transform:translateY(-6px) scale(1.06)}
.bub{position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);background:#fff;color:var(--ink);font-size:12.5px;font-weight:600;line-height:1.3;padding:6px 10px;border-radius:12px;width:max-content;max-width:150px;box-shadow:var(--e2);animation:popin .3s var(--ease) both;z-index:2}
.bub.g{background:var(--mint);color:var(--on-mint)}
.bub.b{background:#ffe1dd;color:var(--bad)}
.bub::after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:inherit}
.thinking{display:inline-flex;gap:3px}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--ink-soft);animation:dots 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes dots{50%{transform:translateY(-4px);opacity:.4}}
.clock{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;color:var(--ink-soft)}
.clock svg{width:34px;height:34px;transform:rotate(-90deg)}
.clock .tr{fill:none;stroke:var(--tint);stroke-width:4}
.clock .fg{fill:none;stroke:var(--accent);stroke-width:4;stroke-dasharray:88;stroke-dashoffset:0;animation:clock 15s linear forwards}
@keyframes clock{to{stroke-dashoffset:88}}
.phase-tag{display:inline-block;justify-self:start;background:var(--tint);color:var(--good);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}

/* live ops */
.live-head{display:flex;align-items:center;gap:12px}
.live-head .live{color:var(--bad);font-weight:700;font-size:13px;letter-spacing:.08em}
.livebar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.lstat{background:var(--night);color:#fff;border-radius:12px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.lstat span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.75;font-weight:600}
.lstat b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lq{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;min-height:200px;align-content:start;background:var(--paper-2);border-radius:16px;padding:14px;position:relative}
.lq.on:empty::after{content:"All clear for now. Stay sharp!"}
.lq:empty::after{content:"Problems will appear here when you go live";white-space:pre-line;color:var(--ink-soft);font-size:15px;grid-column:1/-1;align-self:center;text-align:center;padding-top:70px}
.lcard{font-size:14px;padding:10px 12px 16px;display:grid;gap:4px;animation:popin .3s var(--ease) both;min-width:0}
.lcard .tl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.lcard .life{position:absolute;left:10px;right:10px;bottom:6px;height:4px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.lcard.light .life{background:rgba(0,0,0,.12)}
.lcard .life i{display:block;height:100%;width:100%;background:currentColor}
.lcard.urgent{animation:urgent .5s infinite alternate}
@keyframes urgent{to{box-shadow:0 0 0 4px rgba(196,42,54,.35),var(--lift)}}
.lteam{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.resp{position:relative;border:0;background:#fff;border-radius:16px;box-shadow:var(--e1);padding:10px 6px 12px;display:grid;justify-items:center;gap:2px;font-weight:600;font-size:14px;min-width:0}
.resp .av{width:56px}
.resp small{color:var(--ink-soft);font-weight:500;font-size:12px}
.resp .busy{width:80%;height:5px;border-radius:3px;background:var(--tint);overflow:hidden;margin-top:4px}
.resp .busy i{display:block;height:100%;width:0;background:var(--accent)}
.resp.isbusy{opacity:.65}
.plus{position:absolute;top:-8px;right:10px;font-weight:700;color:#fff;background:var(--good);border-radius:8px;padding:0 6px;animation:deltaUp 1s forwards}

@media (max-width:620px){
  .livebar{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lq{grid-template-columns:repeat(2,minmax(0,1fr))}
  .resp .av{width:42px}
  .resp{font-size:13px}
  .hero{grid-template-columns:1fr}
  .fan{height:300px}
  .fan .card{width:170px;height:230px;margin:-115px 0 0 -85px}
  .phase-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cycle{grid-template-columns:1fr;justify-items:center;text-align:center}
  .cycle-text{justify-items:center}
  .cycle .ringbox svg{width:220px;height:220px}
  .bm .av{width:48px}
  .presenter .av{width:58px}
  .bub{max-width:110px;font-size:11.5px}
  .sheet{padding:18px}

<script>
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
function h(tag,props,...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v===false||v==null) continue;
    if(k==='class') el.className=v;
    else if(k==='style') el.style.cssText=v;
    else if(k==='html') el.innerHTML=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2),v);
    else el.setAttribute(k,v===true?'':v);
  }
  for(const kid of kids.flat(Infinity)){ if(kid==null||kid===false) continue; el.append(kid.nodeType?kid:document.createTextNode(String(kid))); }
  return el;
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const lc=s=>s.charAt(0).toLowerCase()+s.slice(1);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const rot=()=>`--r:${(Math.random()*4-2).toFixed(1)}deg`;
let timers=[];
const later=(fn,ms)=>{const id=setTimeout(fn,ms);timers.push(id);return id};
const wait=ms=>new Promise(r=>later(r,ms));
function clearTimers(){timers.forEach(id=>{clearTimeout(id);clearInterval(id)});timers=[]}
function bounce(el){ el.classList.remove('bounce'); void el.offsetWidth; el.classList.add('bounce'); }
function snap(el){ el.classList.remove('snap'); void el.offsetWidth; el.classList.add('snap'); sfx('pop'); }
let SOUND=true; try{ SOUND=localStorage.getItem('initiate.sound')!=='off'; }catch(e){}
let actx=null;
function sfx(kind){
  if(!SOUND) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const seq={pop:[[660,.05]],good:[[523,.07],[784,.12]],bad:[[196,.18]],win:[[523,.09],[659,.09],[784,.09],[1046,.22]],whoosh:[[330,.05],[494,.05],[740,.08]],tick:[[880,.03]],stamp:[[140,.12],[90,.1]]}[kind]||[];
    let t=actx.currentTime+.01;
    seq.forEach(([f,d])=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type=kind==='bad'||kind==='stamp'?'square':'triangle'; o.frequency.value=f; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(kind==='bad'||kind==='stamp'?.06:.12,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+.03); t+=d; });
  }catch(e){}
}
function confetti(host,n){
  if(!host) return; const box=h('div',{class:'confetti','aria-hidden':'true'}); const C=['#6BE683','#f2b632','#e5533d','#3557c6','#ef8db0','#1f9e93','#9478d1'];
  for(let i=0;i<(n||46);i++) box.append(h('i',{style:`--x:${Math.random()*100}%;--c:${C[i%C.length]};--r:${Math.random()*180|0}deg;--d:${(1.4+Math.random()*1.4).toFixed(2)}s;--y:${260+Math.random()*320|0}px;animation-delay:${(Math.random()*.25).toFixed(2)}s`}));
  host.append(box); setTimeout(()=>box.remove(),3200);
}
function countUp(el,to,ms){ const t0=performance.now(); const step=t=>{ const k=Math.min(1,(t-t0)/(ms||800)); el.textContent=Math.round(to*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(step); }; requestAnimationFrame(step); }
function sayBox(initial){ const el=h('p',{class:'say',role:'status','aria-live':'polite'},initial||''); el.set=(m,k)=>{el.textContent=m;el.className='say'+(k?' '+k:''); if(k==='good') sfx('good'); else if(k==='bad') sfx('bad');}; return el; }
const fmtRM=n=>'RM '+Math.round(n).toLocaleString('en-MY');

/* ================= drag + tap engine =================
   Every piece can be dragged onto a target, or tapped to pick it up and then tapped onto a target. */
let sel=null;
function select(el,opts){
  if(sel) sel.el.classList.remove('picked');
  if(!el||(sel&&sel.el===el)){ sel=null; document.body.classList.remove('picking'); return; }
  sel={el,opts}; el.classList.add('picked'); document.body.classList.add('picking');
  opts.onPick&&opts.onPick();
}
function draggable(el,opts){
  el.classList.add('drag'); el.tabIndex=0; el.setAttribute('role','button');
  el.addEventListener('pointerdown',e=>{
    if(e.button!==0||el.disabled) return;
    const sx=e.clientX, sy=e.clientY, rect=el.getBoundingClientRect(); let ghost=null, over=null, last=null, raf=null;
    const findOver=ev=>{ const t=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-drop]'); if(t!==over){ over&&over.classList.remove('over'); over=t; over&&over.classList.add('over'); } };
    const tick=()=>{ if(!ghost||!last){ raf=null; return; } const y=last.clientY, H=window.innerHeight; let dy=0;
      if(y<80) dy=-Math.ceil((80-y)/5); else if(y>H-80) dy=Math.ceil((y-(H-80))/5);
      if(dy){ window.scrollBy(0,dy); findOver(last); } raf=requestAnimationFrame(tick); };
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    const move=ev=>{
      const dx=ev.clientX-sx, dy=ev.clientY-sy;
      if(!ghost && Math.hypot(dx,dy)>8){
        ghost=el.cloneNode(true); ghost.classList.add('ghost'); ghost.classList.remove('picked');
        Object.assign(ghost.style,{position:'fixed',left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',margin:'0',zIndex:100,pointerEvents:'none'});
        document.body.append(ghost); el.classList.add('lifted'); select(null);
      }
      if(ghost){
        ghost.style.transform=`translate(${dx}px,${dy}px) rotate(-3deg) scale(1.04)`;
        last={clientX:ev.clientX,clientY:ev.clientY}; findOver(last);
        if(!raf) raf=requestAnimationFrame(tick);
      }
    };
    const up=()=>{
      el.removeEventListener('pointermove',move); el.removeEventListener('pointerup',up); el.removeEventListener('pointercancel',up);
      if(raf){ cancelAnimationFrame(raf); raf=null; }
      if(ghost){ const g=ghost; ghost=null; g.remove(); el.classList.remove('lifted'); if(over){ over.classList.remove('over'); opts.onDrop(over); } }
      else select(el,opts);
    };
    el.addEventListener('pointermove',move); el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
  });
  el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); select(el,opts); } });
}
function dropTarget(el,onEmptyTap){
  el.dataset.drop='1';
  el.addEventListener('click',()=>{ if(sel){ const s=sel; select(null); s.opts.onDrop(el); } else if(onEmptyTap) onEmptyTap(); });
}

  else s+=`<rect x="52" y="84" width="16" height="18" rx="4" fill="${sk}"/>`;
  s+= tud?`<ellipse cx="60" cy="66" rx="20" ry="23" fill="${sk}"/>`:`<circle cx="60" cy="64" r="25" fill="${sk}"/>`;
  if(!tud){
    if(o.hw==='none'||!o.hw) s+= f?`<path d="M35 61 Q35 36 60 36 Q86 36 86 62 Q74 50 57 48 Q47 57 35 61Z" fill="${hr}"/>`:`<path d="M35 58 Q35 35 60 35 Q86 35 85 58 Q80 46 60 46 Q42 46 35 58Z" fill="${hr}"/>`;
    else s+=`<path d="M35 58 Q36 48 42 46 L78 46 Q84 48 85 58 Q80 52 60 52 Q40 52 35 58Z" fill="${hr}"/>`;
  }
  if(o.hw==='songkok') s+=`<path d="M37 51 L39 31 Q60 27 81 31 L83 51 Q60 47 37 51Z" fill="#1f1f27"/>`;
  if(o.hw==='kopiah') s+=`<path d="M36 51 Q37 32 60 31 Q83 32 84 51 Q60 46 36 51Z" fill="#f8f8f3" stroke="#d6d2c7" stroke-width="1.5"/><path d="M42 44 H78" stroke="#d6d2c7" stroke-width="1.5"/>`;
  if(o.hw==='cap') s+=`<path d="M35 53 Q35 31 60 31 Q85 31 85 53Z" fill="${o.capc||'#23262e'}"/><path d="M36 51 Q62 47 94 55 Q62 60 36 55Z" fill="${o.capc||'#23262e'}"/>`;
  const ey=tud?64:63;
  s+=`<circle cx="51" cy="${ey}" r="3.2" fill="#23262e"/><circle cx="69" cy="${ey}" r="3.2" fill="#23262e"/><path d="M52 ${ey+11} Q60 ${ey+17} 68 ${ey+11}" stroke="#23262e" stroke-width="2.8" fill="none" stroke-linecap="round"/><circle cx="44" cy="${ey+8}" r="4.5" fill="#f08b8b" opacity=".45"/><circle cx="76" cy="${ey+8}" r="4.5" fill="#f08b8b" opacity=".45"/>`;
  return s+'</svg>';
}

const CYCLE=['Idea','Plan','Build','Test','Launch','Learn'];
const PHASE_OF={napkin:0,bmc:0,pitch:0,pm:1,po:1,pa:1,ux:1,dev:2,qa:3,uat:3,live:4,beta:4};
function cycleView(){
  const st=STG[S.stage], idx=PHASE_OF[st.id], prev=S.stage>0?PHASE_OF[STG[S.stage-1].id]:0;
  const from=prev*60, to=idx===prev?prev*60+360:idx*60;
  let svg=`<svg viewBox="0 0 250 250" role="img" aria-label="Product cycle, now in the ${CYCLE[idx]} phase"><circle class="ring" cx="125" cy="125" r="95"/>`;
  CYCLE.forEach((c,i)=>{ const a=(i*60-90)*Math.PI/180, x=125+95*Math.cos(a), y=125+95*Math.sin(a); svg+=`<g class="nd ${i<idx?'done':i===idx?'on':''}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="20"/><text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}">${c}</text></g>`; });
  svg+=`<g class="runner" style="--from:${from}deg;--to:${to}deg"><circle cx="125" cy="30" r="7" fill="#0F1A12"/></g><text class="center" x="125" y="120">Production</text><text class="center" x="125" y="140">cycle</text></svg>`;
  return h('section',{class:'sheet'},h('div',{class:'cycle'},h('div',{class:'ringbox',html:svg}),
    h('div',{class:'cycle-text'},npcAv(st.npc),h('span',{class:'phase-tag'},`${CYCLE[idx]} phase`),h('h2',{},STG_TITLE[st.id]),h('p',{class:'real'},`Step ${S.stage+1} of ${STG.length} · ${st.role} · ${st.who}`),
      h('div',{class:'cycle-bar'},h('i')),
      h('div',{class:'actions'},h('button',{class:'btn',onclick:()=>{ cycleFor=S.stage; render(); }},'Start now')))));
}

function finish(score,lines){
  score=Math.round(clamp(score,0,100));
  const st=STG[S.stage]; S.scores[st.id]=score;
  const gained=50+(score>=60?50:0)+Math.round(score*.3);
  const before=S.level; addXP(gained);
  const earned=checkBadges(st.id).filter(b=>!S.badges.includes(b)); S.badges.push(...earned);
  S.lastResult={id:st.id,score,lines,gained,levelUp:S.level>before?S.level:0,badges:earned};
  S.stage++; S.screen='result'; save(); render();
}
function checkBadges(id){
  const out=[], F=S.flags;
  if(id==='napkin'&&S.napkinStrong===4) out.push('sharp_napkin');
  if(id==='bmc'&&S.bmcMistakes===0) out.push('canvas_pro');
  if(id==='pitch'&&F.pitchTries===0) out.push('first_pitch');
  if(id==='pm'&&S.scores.pm>=100) out.push('lean_team');
  if(id==='po'&&F.mvp) out.push('mvp_mindset');
  if(id==='pa'&&S.scores.pa>=100) out.push('testable');
  if(id==='ux'&&F.cleanScreen) out.push('clean_screen');
  if(id==='dev'&&!F.skippedTests) out.push('no_shortcuts');
  if(id==='qa'&&F.allBugs) out.push('bug_hunter');
  if(id==='uat'&&F.scopeGuard) out.push('scope_guardian');
  if(id==='live'&&F.firefighter) out.push('firefighter');
  if(id==='beta'&&S.launch&&+S.launch.rating>=4.5) out.push('customer_love');
  return out;
}

/* ================= 1. Idea Napkin ================= */
function stNapkin(){
  const idea=I(); const LABEL=Object.fromEntries(NAPKIN_LINES);

  const tray=h('div',{class:'tray'});
  const COLS=['var(--sky)','var(--tomato)','var(--leaf)','var(--lilac)','var(--teal)','var(--cobalt)','var(--pink)','var(--kraft)'];
  const pieces=shuffle(Object.entries(idea.napkin).flatMap(([cat,arr])=>arr.map((t,k)=>({cat,t,strong:k===0}))));
  const lines={};
  const oneLiner=h('input',{id:'oneliner',value:S.oneLiner,maxlength:'110','aria-label':'Your idea in one line',oninput:e=>{S.oneLiner=e.target.value;}});
  const napkin=h('div',{class:'napkin'},h('div',{class:'hand'},idea.name),oneLiner,
    NAPKIN_LINES.map(([cat,label])=>{ const v=h('span',{class:'v'},'Drop a scrap here'); const el=h('button',{class:'nline'},h('span',{class:'k'},label),v); el.v=v; lines[cat]=el;
      dropTarget(el,()=>{ if(filled[cat]){ tray.append(filled[cat].el); filled[cat].el.hidden=false; filled[cat]=null; el.classList.remove('full'); v.textContent='Drop a scrap here'; upd(); } });
      return el; }));
  pieces.forEach((p,i)=>{
    p.el=h('div',{class:'scrap'+(COLS[i]==='var(--kraft)'?' light':''),style:`--c:${COLS[i]};${rot()}`},p.t);
    draggable(p.el,{onPick:()=>say.set('Now tap the napkin line where this scrap belongs.'),onDrop:t=>place(p,t)});
    tray.append(p.el);
  });
  function place(p,t){
    const cat=Object.keys(lines).find(k=>lines[k]===t); if(!cat) return;
    if(p.cat!==cat){ mistakes++; bounce(p.el); say.set(`Not quite. That scrap is about "${LABEL[p.cat]}", not "${LABEL[cat]}".`,'bad'); return; }
    if(filled[cat]){ tray.append(filled[cat].el); filled[cat].el.hidden=false; }
    filled[cat]=p; p.el.hidden=true; t.classList.add('full'); t.v.textContent=p.t; snap(t);
    say.set(p.strong?'Nice. That line is specific.':'It fits, but it is vague. Is there a sharper scrap?',p.strong?'good':'');
    upd();
  }
  const btn=h('button',{class:'btn',disabled:true,onclick:done},'My napkin is ready');
  function upd(){ btn.disabled=NAPKIN_LINES.some(([c])=>!filled[c]); }
  function done(){

    if(mistakes) lines2.push(`${mistakes} scrap${mistakes>1?'s':''} went to the wrong line first.`);
    finish(strong*25-mistakes*4,lines2);
  }
  return [intro('Sketch your Idea Napkin',`Every big business starts as a scribble on a napkin. Write your idea in one line, then fill the four napkin lines. Each line has a sharp scrap and a vague one.`,'Drag a scrap onto a napkin line, or tap the scrap and then tap the line. Tap a filled line to take its scrap back.','Founders test whether an idea is clear enough to explain on a napkin before writing any plan.'),

/* ================= 2. Business Model Canvas ================= */
function stBMC(){
  const idea=I(); const deckCards=shuffle(BMC_BLOCKS.map(([id])=>({id,t:idea.bmc[id]})));
  const COLS=['var(--mustard)','var(--pink)','var(--sky)','#a8d8a0','#f7c59f','#c7b8ee'];

  const deck=h('div',{class:'deck'});
  const blocks={};
  const grid=h('div',{class:'bmc'},BMC_BLOCKS.map(([id,name,q])=>{ const el=h('button',{class:'blk',style:`grid-area:${id}`},h('b',{},name),h('small',{},q)); blocks[id]=el; dropTarget(el,()=>{ if(idx<deckCards.length) place(el); }); return el; }));
  function drawDeck(){
    deck.replaceChildren();
    if(idx>=deckCards.length){ deck.append(h('h3',{},'Canvas complete. Every block is filled.')); btn.disabled=false; say.set(`All 9 blocks filled with ${mistakes} mistake${mistakes===1?'':'s'}.`,'good'); return; }

    t.classList.add('full'); t.append(h('span',{class:'placed',style:`--c:${COLS[idx%COLS.length]}`},c.t)); snap(t);

    idx++; drawDeck();

  const btn=h('button',{class:'btn',disabled:true,onclick:()=>{ S.bmcMistakes=mistakes; S.weeks+=1;
    finish(100-mistakes*8,[`All 9 blocks of the Business Model Canvas are filled.`,mistakes?`${mistakes} card${mistakes>1?'s':''} went to the wrong block first.`:'Every card went to the right block first time.',`Your value proposition: "${idea.bmc.vp}".`,`Revenue: "${idea.bmc.rs}".`]); }},'Take the canvas to the pitch');

/* ================= 4. Project manager ================= */
function stPM(){
  let devs=2, qa=true, devops=true, sprints=4;
  const RATE={po:3,pa:2,ux:2,dev:4,qa:2.5,devops:3}, RESERVE=8;
  const out=h('div',{}), warn=h('p',{class:'warn',role:'status'});

  const calc=()=>{ const per=RATE.po+RATE.pa+RATE.ux+devs*RATE.dev+(qa?RATE.qa:0)+(devops?RATE.devops:0); const total=per*sprints; const vel=devs*5; return {per,total,vel,cap:vel*sprints,left:S.budget-total}; };
  const row=(a,b,bad)=>h('div',{class:'row'},h('span',{},a),h('b',{class:bad?'bad':''},b));
  const devVal=h('b',{}), spVal=h('b',{});
  const qaBtn=h('button',{class:'scrap member',style:'--c:var(--warn)',onclick:()=>{qa=!qa;upd();}});
  const doBtn=h('button',{class:'scrap member',style:'--c:var(--leaf)',onclick:()=>{devops=!devops;upd();}});
  function upd(){
    const c=calc(); devVal.textContent=devs; spVal.textContent=sprints;
    qaBtn.setAttribute('aria-pressed',qa); qaBtn.classList.toggle('off',!qa);
    qaBtn.replaceChildren(h('span',{},'QA engineer',h('small',{},'Finds bugs before customers do')),h('span',{class:'toggle-note'},qa?`Hired · RM ${RATE.qa}k`:'Tap to hire'));
    doBtn.setAttribute('aria-pressed',devops); doBtn.classList.toggle('off',!devops);
    doBtn.replaceChildren(h('span',{},'DevOps engineer',h('small',{},'CI/CD pipeline and servers')),h('span',{class:'toggle-note'},devops?`Hired · RM ${RATE.devops}k`:'Tap to hire'));
    out.replaceChildren(row('Cost per sprint',`RM ${c.per.toFixed(1)}k`),row('Total build cost',`RM ${c.total.toFixed(1)}k`),row('Budget left after the build',`RM ${c.left.toFixed(1)}k`,c.left<RESERVE),row('Team speed',`${c.vel} points per sprint`),row('Total capacity',`${c.cap} points in ${sprints*2} weeks`));
    commit.disabled=c.left<RESERVE;
    warn.textContent=c.left<RESERVE?`Over budget. Keep at least RM ${RESERVE}k for UAT fixes and launch.`:'';
  }
  const fixed=(n,d,r,c)=>h('div',{class:'scrap member',style:`--c:${c}`},h('span',{},n,h('small',{},d)),h('span',{class:'toggle-note'},`RM ${r}k`));
  const stepper=(label,v,dec,inc)=>h('div',{class:'row'},h('span',{},label),h('div',{class:'stepper'},h('button',{'aria-label':'Fewer',onclick:dec},'−'),v,h('button',{'aria-label':'More',onclick:inc},'+')));
  upd();
  function done(){
    const c=calc(); S.team={devs,qa,devops,sprints,vel:c.vel,cap:c.cap}; S.budget=+(S.budget-c.total).toFixed(1); S.weeks+=1;
    const score=40+(qa?20:0)+(devops?20:0)+(c.left<=25?20:8)-(c.cap<24?20:0);
    const lines=[`${devs} developer${devs>1?'s':''}, ${sprints} sprints of 2 weeks, ${c.cap} story points of capacity.`,
      qa?'QA hired: testing gets a bug count and fewer bugs slip through.':'No QA: developers test their own work, so more bugs slip through.',
      devops?'DevOps hired: a reliable CI/CD pipeline and quick fixes.':'No DevOps: every broken pipeline costs an extra week.',
      c.left>25?`RM ${c.left.toFixed(1)}k left unused. That could have bought more capacity.`:`RM ${c.left.toFixed(1)}k kept in reserve for UAT and launch.`];
    if(c.cap<24) lines.push('Capacity is very low. Most of the backlog will not fit.');

  return [intro('Plan the team and the timeline',`${I().name} is funded with RM ${S.budget}k. Choose the team and how many 2-week sprints to run. Every sprint costs the whole team's pay.`,'Tap QA and DevOps to hire or release them. Use + and − for developers and sprints. Keep a reserve.','The project manager owns scope, time, cost and risk, and sets up the Scrum rhythm with the team.'),
    sheet(h('h3',{},'Team (cost per sprint)'),fixed('Product owner','Owns the backlog',RATE.po,'var(--tomato)'),fixed('Product analyst','Writes requirements',RATE.pa,'var(--teal)'),fixed('UI/UX designer','Designs and tests screens',RATE.ux,'var(--lilac)'),qaBtn,doBtn,
      stepper(`Developers (RM ${RATE.dev}k each)`,devVal,()=>{devs=Math.max(1,devs-1);upd();},()=>{devs=Math.min(4,devs+1);upd();}),
      stepper('Sprints (2 weeks each)',spVal,()=>{sprints=Math.max(3,sprints-1);upd();},()=>{sprints=Math.min(5,sprints+1);upd();})),

/* ================= 5. Product owner ================= */
function knap(items,cap){ const dp=new Array(cap+1).fill(0); for(const it of items) for(let c=cap;c>=it.e;c--) dp[c]=Math.max(dp[c],dp[c-it.e]+it.v); return dp[cap]; }
function stPO(){
  const T=S.team; const stories=STORIES.map(s=>({...s,t:storyT(s),tag:''}));
  const fillEl=h('i'), txt=h('b'), warn=h('p',{class:'warn',role:'status'}), left=h('span',{class:'real'});
  const commit=h('button',{class:'btn',disabled:true,onclick:done},'Commit the backlog');
  const list=h('div',{style:'display:grid;gap:10px'},stories.map(s=>{
    const seg=h('div',{class:'seg',role:'group','aria-label':`Priority for ${s.t}`},TAGS.map(t=>h('button',{'data-t':t,'aria-pressed':'false',onclick:()=>{ s.tag=t; seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t)); upd(); }},TAGNAME[t])));
    return h('div',{class:'story-row'},h('div',{class:'story-top'},h('span',{},s.t),h('span',{class:'tags'},h('span',{class:'tag'},`value ${s.v}`),h('span',{class:'tag'},`${s.e} pts`))),seg);
  }));
  function upd(){
    const used=stories.filter(s=>s.tag==='M'||s.tag==='S').reduce((a,s)=>a+s.e,0);
    fillEl.style.width=clamp(used/T.cap*100,0,100)+'%'; fillEl.style.background=used>T.cap?'var(--tomato)':'var(--leaf)';
    txt.textContent=`${used} of ${T.cap} points`;
    warn.textContent=used>T.cap?'Must + Should is bigger than your capacity. Something will not get built.':'';
    const n=stories.filter(s=>!s.tag).length; left.textContent=n?`${n} stor${n>1?'ies':'y'} still need a priority.`:'All stories prioritised.';
    commit.disabled=n>0;
  }
  upd();
  function done(){
    const order=[...stories].sort((a,b)=>TAGS.indexOf(a.tag)-TAGS.indexOf(b.tag));
    let l=T.cap, planned=0; for(const s of order){ if(s.tag!=='W'&&s.e<=l){ l-=s.e; planned+=s.v; } }
    const best=knap(stories,T.cap);
    const coreLow=stories.filter(s=>s.core&&(s.tag==='C'||s.tag==='W')), trapHigh=stories.filter(s=>s.trap&&(s.tag==='M'||s.tag==='S'));
    S.flags.mvp=!coreLow.length&&!trapHigh.length;
    S.backlog=order.map(({id,t,v,e,core,trap,tag})=>({id,t,v,e,core,trap,tag})); S.best=best; S.planned=planned; S.weeks+=1;
    const lines=[`Planned value: ${planned} of the best possible ${best} for your capacity.`];
    coreLow.forEach(s=>lines.push(`"${s.t}" is core to the product but was not a Must or Should.`));
    trapHigh.forEach(s=>lines.push(`"${s.t}" costs ${s.e} points for little value. Leave it for later.`));
    if(!coreLow.length) lines.push('All core stories are in: customers can browse and pay, and staff can handle orders.');
    finish(planned/best*100-coreLow.length*15-trapHigh.length*8,lines);
  }
  return [intro('Prioritise the product backlog',`Give every user story a priority. The team can build about ${T.cap} points. Sprints work through Must, then Should, then Could, until time runs out.`,'Tap Must, Should, Could or Won\'t under each story. Watch the capacity bar.','The product owner owns the backlog and decides what gets built first. MoSCoW is one common method.'),
    sheet(h('div',{style:'display:grid;gap:4px'},h('div',{class:'meter-l'},h('span',{},'Must + Should vs capacity'),txt),h('div',{class:'meter'},fillEl)),warn,list,left,h('div',{class:'actions'},commit))];
}

/* ================= 6. Product analyst ================= */
function stPA(){
  const reqs=shuffle(REQS).map(r=>({...r,fix:r.fix&&fill(r.fix),marked:false}));
  let revealed=false;
  const list=h('div',{style:'display:grid;gap:10px'},reqs.map(r=>{ r.el=h('button',{class:'req','aria-pressed':'false',onclick:()=>{ if(revealed) return; r.marked=!r.marked; r.el.classList.toggle('marked',r.marked); r.el.setAttribute('aria-pressed',r.marked); }},h('span',{},r.t)); return r.el; }));
  const btn=h('button',{class:'btn',onclick:()=>revealed?done():reveal()},'Send to the team');
  function reveal(){
    revealed=true;
    reqs.forEach(r=>{ const right=r.marked===!!r.vague;
      r.el.append(h('span',{class:'verdict '+(right?'good-t':'bad-t')},r.vague?(r.marked?'Vague: caught':'Vague: missed'):(r.marked?'Already testable: flagged by mistake':'Testable')));
      if(r.vague) r.el.append(h('span',{class:'fix'},'Acceptance criteria: '+r.fix)); });

  }
  function done(){
    const caught=reqs.filter(r=>r.vague&&r.marked).length, missed=reqs.filter(r=>r.vague&&!r.marked).length, wrong=reqs.filter(r=>!r.vague&&r.marked).length;
    S.quality=clamp(S.quality+caught*2-missed*3,0,100); S.weeks+=1;
    finish(100-(missed+wrong)*15,[`${caught} of 4 vague requirements caught and rewritten.`,missed?`${missed} vague requirement${missed>1?'s':''} reached the developers. Expect guesswork.`:'Developers know exactly what "done" means.',wrong?`${wrong} clear requirement${wrong>1?'s were':' was'} flagged by mistake.`:'No false alarms.']);
  }
  return [intro('Make every requirement testable','Some of these requirements are too vague to build or test. Find them. When you send them on, they get rewritten as acceptance criteria.','Tap every vague requirement to flag it (it turns orange). Tap again to unflag.','Analysts turn business needs into acceptance criteria, often written as Given / When / Then.'),
    sheet(h('h3',{},'Requirements from the business'),list,h('div',{class:'actions'},btn))];
}

/* ================= 7. UI/UX ================= */
function stUX(){
  const N=5, slots=new Array(N).fill(null); let tested=false;
  const comps=UXC.map(c=>({...c,label:cap(fill(c.label))}));
  const say=sayBox('Drag components onto the phone, or tap a component to add it to the next empty slot.');
  const phone=h('div',{class:'phone','aria-label':'Home screen'});
  const palette=h('div',{class:'palette'});
  const btn=h('button',{class:'btn',disabled:true,onclick:()=>tested?done():test()},'Run a usability test');
  const result=h('div',{});
  const slotEls=[];
  for(let i=0;i<N;i++){ const el=h('button',{class:'pslot'}); slotEls.push(el); dropTarget(el,()=>{ if(!tested&&slots[i]){ slots[i]=null; draw(); } }); }
  comps.forEach(c=>{ c.el=h('div',{class:'scrap',style:`--c:${c.c};${rot()}`},c.label);
    draggable(c.el,{onPick:()=>{ select(null); const i=slots.indexOf(null); if(i<0){ say.set('The screen is full. Tap a slot on the phone to clear it.','bad'); return; } slots[i]=c; draw(); snap(slotEls[i]); },
      onDrop:t=>{ const i=slotEls.indexOf(t); if(i<0) return; slots[i]=c; draw(); snap(t); }});
    palette.append(c.el); });
  function draw(){
    slotEls.forEach((el,i)=>{ const c=slots[i]; el.classList.toggle('full',!!c); el.replaceChildren(c?h('span',{class:'scrap',style:`--c:${c.c}`},c.label):`Slot ${i+1}`); el.setAttribute('aria-label',c?`Slot ${i+1}: ${c.label}. Tap to remove.`:`Empty slot ${i+1}`); });
    comps.forEach(c=>c.el.classList.toggle('used',slots.includes(c)||tested));
    btn.disabled=!tested&&slots.some(s=>!s);
  }
  phone.append(h('div',{class:'notch'}),...slotEls);
  function test(){
    tested=true;
    const has=id=>slots.some(s=>s.id===id);
    let raw=0; slots.forEach(s=>raw+=s.k==='good'?16:s.k==='ok'?8:-15);
    if(!has('grid')) raw-=20; if(!has('cta')) raw-=20; if(slots[0].id==='top') raw+=6; if(slots[N-1].id==='nav') raw+=6;
    const score=Math.round(clamp(raw/92*100,0,100));
    S.flags.cleanScreen=!slots.some(s=>s.k==='bad');
    const f=[has('cta')?`5 of 5 testers found the "${fill('{cta}')}" button in under 5 seconds.`:has('tiny')?'Only 1 of 5 testers found the tiny checkout link.':'No tester could work out how to order.',
      has('grid')?'Testers liked seeing photos and prices straight away.':'Testers asked: "What do you actually sell?"'];
    if(has('popup')) f.push('3 of 5 testers closed the app at the newsletter pop-up.');
    if(has('video')||has('ads')) f.push('Testers said the screen felt cluttered and slow.');
    f.push(slots[0].id==='top'&&slots[N-1].id==='nav'?'Navigation felt familiar: brand and cart at the top, tabs at the bottom.':'The layout order felt unusual. People expect the brand at the top and tabs at the bottom.');
    if(has('search')) f.push('Search helped returning customers find things fast.');
    S.ux=score; S.value+=Math.round(score/10); S.weeks+=1; S._uxLines=f; refreshHUD();
    result.replaceChildren(sheet(h('h3',{},'Usability test with 5 people'),h('ul',{class:'lines'},f.map(x=>h('li',{},x)))));
    btn.textContent='Continue'; draw(); say.set('Test done. Read what people said below.','good');
    result.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  function done(){ finish(S.ux,[...S._uxLines.slice(0,3),`Design score: ${S.ux}/100.`]); }
  draw();
  return [intro('Design the home screen','Build the main screen from five components, then test it with five real people.','Drag a component onto a phone slot, or tap it to fill the next empty slot. Tap a slot on the phone to clear it.','Designers wireframe, prototype and test with users before any code is written.'),
    sheet(h('div',{class:'ux-wrap'},phone,h('div',{style:'display:grid;gap:8px;min-width:0;width:100%'},h('h3',{},'Components'),palette)),say,h('div',{class:'actions'},btn)),result];
}

/* ================= 8. Developers + DevOps ================= */
function stDev(){
  const T=S.team, todo=S.backlog.filter(s=>s.tag!=='W').map(s=>({...s})), wont=S.backlog.filter(s=>s.tag==='W');
  const done=[], events=shuffle(EVENTS).slice(0,T.sprints);
  let sprint=0, failMod=0, fails=0, busy=false;
  const cols={todo:h('div',{style:'display:grid;gap:8px'}),doing:h('div',{style:'display:grid;gap:8px'}),done:h('div',{style:'display:grid;gap:8px'})};
  const col=(n,b)=>h('div',{class:'col'},h('h4',{},n),b);
  const TAGC={M:'var(--tomato)',S:'var(--warn)',C:'var(--sky)'};
  todo.forEach(s=>{ s.el=h('div',{class:'scrap story',style:`--c:${TAGC[s.tag]};${rot()}`},s.t,h('i',{},`${s.e} pts`)); cols.todo.append(s.el); });
  const nodes=['Commit','Build','Test','Deploy to staging'].map(n=>h('div',{class:'pnode'},n));
  const pipe=h('div',{class:'pipe','aria-label':'CI/CD pipeline'},nodes.flatMap((n,i)=>i?[h('span',{class:'arrow','aria-hidden':'true'},'→'),n]:[n]));
  const ev=h('div',{style:'display:grid;gap:10px',role:'status'},h('p',{class:'real'},'Each sprint starts with a decision. Then the team builds and the pipeline ships to staging.'));
  const log=h('ul',{class:'log'});
  const title=h('h3',{},`Sprint board · ${T.sprints} sprints · ${T.vel} points each`);
  const next=h('button',{class:'btn',onclick:plan},'Plan sprint 1');
  function plan(){
    if(busy) return; next.hidden=true; const e=events[sprint];
    ev.replaceChildren(h('div',{class:'role'},`Sprint ${sprint+1} planning · ${e.who}`),h('p',{class:'ev-q'},e.q),h('div',{class:'choices'},shuffle(e.opts).map(o=>h('button',{class:'scrap choice',style:'--c:var(--cobalt)',onclick:()=>choose(o)},o.t))));
  }
  function choose(o){
    const fx=o.fx; if(o.flag) S.flags[o.flag]=true;
    S.debt+=fx.debt||0; S.quality=clamp(S.quality+(fx.quality||0),0,100); S.budget=+(S.budget+(fx.budget||0)).toFixed(1); S.value+=fx.value||0; failMod+=fx.fail||0;
    refreshHUD(); ev.replaceChildren(h('p',{class:'ev-r'},o.r)); run(T.vel+(fx.cap||0));
  }
  async function run(capacity){
    busy=true; sprint++; title.textContent=`Sprint ${sprint} of ${T.sprints} · capacity ${capacity} points`;
    let left=capacity; const take=[];
    for(const s of todo){ if(!s.taken&&s.e<=left){ take.push(s); left-=s.e; s.taken=true; } }
    take.forEach(s=>cols.doing.append(s.el)); await wait(700);
    for(const s of take){ await wait(500); snap(s.el); cols.done.append(s.el); done.push(s); }
    await pipeline();
    S.weeks+=2; refreshHUD();
    log.append(h('li',{},`Sprint ${sprint}: ${take.length} ${take.length===1?'story':'stories'} done, ${capacity-left} of ${capacity} points used. Shipped to staging.`));
    busy=false;
    if(todo.every(s=>s.taken)&&sprint<T.sprints){ log.append(h('li',{},'Backlog cleared early. The team pays down tech debt with the spare time.')); S.debt=Math.max(0,S.debt-2); S.quality=clamp(S.quality+3,0,100); refreshHUD(); return complete(); }
    if(sprint<T.sprints){ next.textContent=`Plan sprint ${sprint+1}`; next.hidden=false; } else complete();
  }
  async function pipeline(){
    nodes.forEach(n=>n.className='pnode');
    for(let i=0;i<nodes.length;i++){
      const n=nodes[i]; n.classList.add('run'); await wait(420);
      const p=clamp(.15+S.debt*.08+failMod-(T.devops?.12:0),.03,.75);
      if(i===2&&Math.random()<p){ n.className='pnode fail'; fails++; await fixPrompt(); }
      n.className='pnode ok';
    }
  }
  function fixPrompt(){ return new Promise(res=>{
    const msg=h('p',{class:'warn'},T.devops?'Pipeline red: 2 tests failing. Priya traces it in minutes.':'Pipeline red: 2 tests failing. Without a DevOps engineer, fixing it costs an extra week.');
    const b=h('button',{class:'btn red small',onclick:()=>{ b.remove(); msg.remove(); if(!T.devops) S.weeks+=1; S.debt=Math.max(0,S.debt-1); refreshHUD(); res(); }},'Fix the failing tests');
    ev.append(msg,b); }); }
  function complete(){
    const delivered=done.reduce((a,s)=>a+s.v,0);
    S.done=done.map(({id,t,v,e,core,tag})=>({id,t,v,e,core,tag})); S.value+=delivered; refreshHUD();
    const missing=todo.filter(s=>!s.taken), coreMissing=STORIES.filter(c=>c.core&&!done.some(d=>d.id===c.id));
    const lines=[`Delivered ${done.length} stories worth ${delivered} value (best possible: ${S.best}).`];
    if(missing.length) lines.push(`Not built: ${missing.map(s=>s.t).join(', ')}.`);
    if(coreMissing.length) lines.push(`Core feature missing: ${coreMissing.map(c=>storyT(c)).join(', ')}. Customers will notice.`);
    lines.push(`Tech debt: ${S.debt}. Pipeline failures: ${fails}.`);
    next.hidden=true;

  tiles.forEach(t=>{ const txt=t.bug==='typo'?typo(t.l):t.bug==='neg'?t.l.replace('RM ','RM -'):t.bug==='undef'?'undefined':t.bug==='dup'?t.l+t.l:t.l;
    t.el=h('button',{class:'scrap tile'+(/Pay now|Add to cart/.test(t.l)?' act':'')+(t.bug==='tilt'?' b-tilt':'')+(t.bug==='color'?' b-color':''),onclick:()=>hit(t)},txt); grid.append(t.el); });
